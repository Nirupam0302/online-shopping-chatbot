<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2540;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#635bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Animated shapes -->
  <circle cx="300" cy="200" r="150" fill="#ffffff" opacity="0.1" filter="url(#blur)"/>
  <circle cx="1600" cy="800" r="200" fill="#ffffff" opacity="0.1" filter="url(#blur)"/>
  <rect x="800" y="400" width="300" height="300" fill="#ffffff" opacity="0.05" filter="url(#blur)" transform="rotate(45 950 550)"/>
  
  <!-- Pattern overlay -->
  <defs>
    <pattern id="dots" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="2" fill="#ffffff" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  
  <!-- Shopping elements -->
  <text x="100" y="200" font-size="120" fill="#ffffff" opacity="0.1" font-weight="bold">🛒</text>
  <text x="1700" y="900" font-size="120" fill="#ffffff" opacity="0.1" font-weight="bold">💳</text>
  <text x="900" y="1000" font-size="100" fill="#ffffff" opacity="0.1" font-weight="bold">📦</text>
</svg>